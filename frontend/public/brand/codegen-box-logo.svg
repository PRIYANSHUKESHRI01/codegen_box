    <g transform="translate(28 68)" fill="none" stroke="#FFFFFF" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="-4,-11 -12,0 -4,11"/>
      <polyline points="12,-11 20,0 12,11"/>
    </g>
    <circle cx="28" cy="68" r="3.4" fill="#F59E0B"/>
  </g>

  <!-- Wordmark -->
  <text x="150" y="98" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="800" letter-spacing="-1">
    <tspan fill="#0F172A">CodeGen </tspan><tspan fill="#2563EB">Box</tspan>
