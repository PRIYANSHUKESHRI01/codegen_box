; Judge queue workers — run on the APP tier (any host that can reach Redis,
; the database and the Piston nodes). Install:
;   cp judge-workers.conf /etc/supervisor/conf.d/ && supervisorctl reread && supervisorctl update
; After every deploy:  php artisan queue:restart   (workers finish their job, then exit and respawn)
;
; SIZING RULE: total workers ~= total Piston slots (+ ~10%). Each worker holds
; exactly one HTTP call to a Piston node, so worker count is what bounds
; concurrency into the pool. Example: 3 nodes x 16 physical cores = 48 slots -> 52 workers
; (below: 36 primary + 16 interactive). Too few workers wastes hardware; too
; many just pushes the queue into Piston, which queues without any timeout.
;
; Flags:
;   --sleep=0.25   idle poll interval (seconds; fractions are supported)
;   --max-jobs / --max-time / --memory   recycle workers before a leak matters
;   --tries/--timeout are set per-job by JudgeSubmissionJob (retryUntil, 60s);
;   stopwaitsecs must exceed that timeout so a deploy never kills a job mid-run.
;
; Two groups: the primary group drains strictly by priority (live-contest work
; first). The interactive group checks Run FIRST, so a wall of submissions can
; never starve someone pressing Run to debug.

[program:judge-workers]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan queue:work redis --queue=judge-contest,judge-submit,judge-run --sleep=0.25 --max-jobs=500 --max-time=3600 --memory=256
numprocs=36
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=90
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/judge-workers.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3

[program:judge-workers-interactive]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan queue:work redis --queue=judge-run,judge-contest,judge-submit --sleep=0.25 --max-jobs=500 --max-time=3600 --memory=256
numprocs=16
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=90
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/judge-workers-interactive.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
